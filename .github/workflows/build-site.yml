name: Build site

on:
  push:
    branches: [ build-files ]
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push to gh-pages (no PAT or extra secrets needed)
permissions:
  contents: write

# Avoid two builds racing to push to gh-pages
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build-files branch
        uses: actions/checkout@v4
        with:
          ref: build-files
          fetch-depth: 0   # also fetches gh-pages so we can add it as a worktree

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true   # runs bundle install and caches gems

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
          NODE_ENV: production
        run: bundle exec jekyll build

      - name: Check out gh-pages branch into a separate directory
        run: git worktree add ../gh-pages-out origin/gh-pages --detach

      - name: Replace gh-pages contents with the new build
        run: |
          rsync -a --delete --exclude '.git' _site/ ../gh-pages-out/
          # Stop GitHub Pages from re-processing the already-built site with Jekyll
          touch ../gh-pages-out/.nojekyll

      - name: Commit and push to gh-pages
        working-directory: ../gh-pages-out
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy site from ${GITHUB_SHA::7}"
            git push origin HEAD:gh-pages
          fi
